<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/></marker></defs><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="720" height="730" fill="#FFFFFF"/><rect x="24" y="30" width="4" height="18" fill="#1F5FA8"/><text x="36" y="45" font-size="16" fill="#1B1B1B" font-weight="600">图 1-1  裸机启动流程（实验一）</text><text x="36" y="65" font-size="11.5" fill="#5A6672">从 QEMU 载入 ELF 到串口输出第一条字符串；start.S 判异常级别并设栈，prt_reset_vector.S 调 main、返回后屏蔽中断</text><line x1="24" y1="78" x2="696" y2="78" stroke="#D5DBE2" stroke-width="1"/><rect x="180" y="96" width="360" height="46" rx="7" fill="#FFF6E5" stroke="#1F5FA8" stroke-width="1.4"/><text x="360" y="123.500" font-size="12.5" fill="#1B1B1B" text-anchor="middle">QEMU 加载镜像：-kernel build/miniEuler</text><rect x="180" y="172" width="360" height="58" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.4"/><text x="360" y="194.000" font-size="12.5" fill="#1B1B1B" text-anchor="middle">0x40000000  OsElxState   ← start.S / .text.bspinit</text><text x="360" y="210.500" font-size="12.5" fill="#1B1B1B" text-anchor="middle">MRS x6, CurrentEL</text><rect x="180" y="260" width="360" height="46" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.4"/><text x="360" y="287.500" font-size="12.5" fill="#1B1B1B" text-anchor="middle">CMP w6, #4   →   BEQ Start</text><rect x="180" y="336" width="360" height="46" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.4"/><text x="360" y="363.500" font-size="12.5" fill="#1B1B1B" text-anchor="middle">Start：SP = __os_sys_sp_end &amp; ~0xF</text><rect x="180" y="412" width="360" height="46" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.4"/><text x="360" y="439.500" font-size="12.5" fill="#1B1B1B" text-anchor="middle">B OsEnterMain   ← prt_reset_vector.S / .text.startup</text><rect x="180" y="488" width="360" height="58" rx="7" fill="#EAF7EF" stroke="#1F5FA8" stroke-width="1.4"/><text x="360" y="510.000" font-size="12.5" fill="#1B1B1B" text-anchor="middle">BL main   →   main() 直接写 UARTDR（0x09000000）</text><text x="360" y="526.500" font-size="12.5" fill="#1B1B1B" text-anchor="middle">循环 18 次输出 "AArch64 Bare Metal"</text><rect x="180" y="574" width="360" height="46" rx="7" fill="#EAF7EF" stroke="#1F5FA8" stroke-width="1.4"/><text x="360" y="601.500" font-size="12.5" fill="#1B1B1B" text-anchor="middle">main 返回  →  MSR DAIF, #0x1C0（屏蔽中断）</text><rect x="180" y="650" width="360" height="46" rx="7" fill="#F4F6F8" stroke="#1F5FA8" stroke-width="1.4"/><text x="360" y="677.500" font-size="12.5" fill="#1B1B1B" text-anchor="middle">EXITLOOP：B EXITLOOP（原地空转，实验结束）</text><line x1="360" y1="144" x2="360" y2="170" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><line x1="360" y1="232" x2="360" y2="258" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><line x1="360" y1="308" x2="360" y2="334" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><line x1="360" y1="384" x2="360" y2="410" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><line x1="360" y1="460" x2="360" y2="486" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><line x1="360" y1="548" x2="360" y2="572" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><line x1="360" y1="622" x2="360" y2="648" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><rect x="6" y="260" width="160" height="46" rx="7" fill="#FDEDEA" stroke="#1F5FA8" stroke-width="1.4"/><text x="86" y="279.425" font-size="10.5" fill="#1B1B1B" text-anchor="middle">Z=0 → OsEl2Entry</text><text x="86" y="293.925" font-size="10.5" fill="#1B1B1B" text-anchor="middle">B .   挂死</text><line x1="180" y1="283" x2="168" y2="283" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><text x="174" y="274" font-size="11" fill="#5A6672" text-anchor="middle">否</text><text x="370" y="328" font-size="11" fill="#5A6672" text-anchor="start">是</text><rect x="572" y="172" width="124" height="200" rx="7" fill="#F4F6F8" stroke="#B9C3CE" stroke-width="1.4" stroke-dasharray="4 3"/><text x="634" y="232.175" font-size="10.5" fill="#1B1B1B" text-anchor="middle">QEMU virt 上电</text><text x="634" y="246.675" font-size="10.5" fill="#1B1B1B" text-anchor="middle">默认 EL1</text><text x="634" y="261.175" font-size="10.5" fill="#1B1B1B" text-anchor="middle"></text><text x="634" y="275.675" font-size="10.5" fill="#1B1B1B" text-anchor="middle">CurrentEL</text><text x="634" y="290.175" font-size="10.5" fill="#1B1B1B" text-anchor="middle">= 0b0100</text><text x="634" y="304.675" font-size="10.5" fill="#1B1B1B" text-anchor="middle">→ x6 = 4</text><text x="634" y="319.175" font-size="10.5" fill="#1B1B1B" text-anchor="middle">→ Z = 1</text></g></svg>